version: 2

project_name: loglens

before:
  hooks:
    - go mod tidy

builds:
  - id: loglens
    main: ./cmd/loglens
    binary: loglens
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/loglens/loglens/internal/tui.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: loglens
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CONTRIBUTING.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

signs:
  # Keyless cosign signing via Sigstore/Fulcio + GitHub Actions OIDC.
  # No private key or password is stored anywhere; the signing certificate
  # is short-lived (~10m) and tied to the workflow run. The resulting
  # .sig + .pem (and Rekor transparency log entry) are sufficient for
  # `cosign verify-blob` against the workflow identity.
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"

dockers:
  - id: loglens-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/malagant/loglens:{{ .Version }}-amd64"
      - "ghcr.io/malagant/loglens:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=loglens"
      - "--label=org.opencontainers.image.description=One TUI, every log source, one query language."
      - "--label=org.opencontainers.image.source=https://github.com/malagant/loglens"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: loglens-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/malagant/loglens:{{ .Version }}-arm64"
      - "ghcr.io/malagant/loglens:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=loglens"
      - "--label=org.opencontainers.image.description=One TUI, every log source, one query language."
      - "--label=org.opencontainers.image.source=https://github.com/malagant/loglens"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/malagant/loglens:{{ .Version }}"
    image_templates:
      - "ghcr.io/malagant/loglens:{{ .Version }}-amd64"
      - "ghcr.io/malagant/loglens:{{ .Version }}-arm64"
  - name_template: "ghcr.io/malagant/loglens:latest"
    image_templates:
      - "ghcr.io/malagant/loglens:latest-amd64"
      - "ghcr.io/malagant/loglens:latest-arm64"

brews:
  - name: loglens
    repository:
      owner: malagant
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/malagant/loglens"
    description: "One TUI, every log source, one query language."
    license: MIT
    install: |
      bin.install "loglens"
    test: |
      assert_match version.to_s, shell_output("#{bin}/loglens --version")

scoops:
  - repository:
      owner: malagant
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/malagant/loglens"
    description: "One TUI, every log source, one query language."
    license: MIT

release:
  draft: false
  prerelease: auto
  github:
    owner: malagant
    name: loglens

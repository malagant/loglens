name: Feature request
description: Propose a new capability or improvement.
title: "[feature] "
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain — workflow, frequency, current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would LogLens do, and how would a user interact with it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workflows that partially solve this, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area/k8s
        - area/file
        - area/journald
        - area/docker
        - area/filter-dsl
        - area/ui
        - area/release
        - area/docs
        - area/other
    validations:
      required: true
